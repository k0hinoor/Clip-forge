# Local deployment: API + worker sharing one data volume (SQLite WAL by default).
#   docker compose up --build
#   docker compose --profile ollama up --build        # + local LLM for titles/hooks
#   docker compose --profile postgres up --build      # + Postgres (set DATABASE_URL)
x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    STORAGE_ROOT: /data
    WHISPER_MODEL_DIR: /models
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  volumes:
    - clipforge-data:/data
    - clipforge-models:/models
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["python", "-m", "clipforge.api"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "clipforge.worker"]
    environment:
      STORAGE_ROOT: /data
      WHISPER_MODEL_DIR: /models
      AUTO_MIGRATE: "false"   # the API owns migrations
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    # Uncomment for NVIDIA GPUs (requires the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  clipforge-data:
  clipforge-models:
  ollama-models:
  postgres-data:

# Candidate scoring configuration (TRD §14). All weights are configuration.
# Bump `version` whenever weights or feature definitions change so stored
# scores remain attributable (TRD §47).
version: "1.0"
weights:
  hook: 0.20
  completeness: 0.20
  emotional_interest: 0.15
  information_value: 0.15
  narrative_completeness: 0.10
  audio_quality: 0.05
  visual_quality: 0.05
  caption_suitability: 0.05
  length_fit: 0.05
  # Optional semantic signal from the local LLM. 0 = recorded but not weighted.
  llm_interest: 0.0
selection:
  # Max temporal overlap (intersection over union) between two selected clips.
  max_overlap_iou: 0.25
  # Candidates kept in the database (with raw features) for future training.
  persist_top_n: 50
  # Upper bound on generated candidate windows (cost control).
  max_candidates: 3000
  # Max candidate end-points per start sentence.
  ends_per_start: 4
reasons:
  # A reason is shown when the feature value is at least this threshold.
  hook: 0.6
  completeness: 0.75
  emotional_interest: 0.55
  information_value: 0.6
  narrative_completeness: 0.6
  caption_suitability: 0.75
  length_fit: 0.95

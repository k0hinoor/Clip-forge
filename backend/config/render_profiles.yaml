# Render presets (TRD §21). Seeded into the `render_profiles` table on startup;
# the database copy is authoritative afterwards (admins may edit it).
profiles:
  vertical_v1:
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: null          # null = keep source fps
    video_codec: h264
    audio_codec: aac
    crf: 20
    preset: veryfast
    audio_bitrate_kbps: 160
    version: "1"
    default: true
  horizontal_v1:
    aspect_ratio: "16:9"
    width: 1920
    height: 1080
    fps: null
    video_codec: h264
    audio_codec: aac
    crf: 20
    preset: veryfast
    audio_bitrate_kbps: 160
    version: "1"
  square_v1:
    aspect_ratio: "1:1"
    width: 1080
    height: 1080
    fps: null
    video_codec: h264
    audio_codec: aac
    crf: 20
    preset: veryfast
    audio_bitrate_kbps: 160
    version: "1"

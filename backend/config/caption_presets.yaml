# Caption presets (PRD §9). Colours are #RRGGBB; sizes are a fraction of the
# output height so captions scale with the render profile. Rendering is fully
# deterministic from this configuration.
presets:
  clean:
    label: Clean
    font: DejaVu Sans
    bold: false
    size: 0.045
    primary_color: "#FFFFFF"
    emphasis_color: "#FFFFFF"
    outline_color: "#000000"
    outline: 0.0035
    shadow: 0.0015
    uppercase: false
    max_chars_per_line: 26
    max_lines: 2
    position: 0.28        # distance of baseline from bottom, fraction of height
    emphasis: false
  bold:
    label: Bold
    font: DejaVu Sans
    bold: true
    size: 0.058
    primary_color: "#FFFFFF"
    emphasis_color: "#FFE600"
    outline_color: "#000000"
    outline: 0.005
    shadow: 0.002
    uppercase: true
    max_chars_per_line: 18
    max_lines: 2
    position: 0.30
    emphasis: true
  creator:
    label: Creator
    font: DejaVu Sans
    bold: true
    size: 0.064
    primary_color: "#FFFFFF"
    emphasis_color: "#3CFF7A"
    outline_color: "#000000"
    outline: 0.006
    shadow: 0.003
    uppercase: true
    max_chars_per_line: 14
    max_lines: 2
    position: 0.34
    emphasis: true
  minimal:
    label: Minimal
    font: DejaVu Sans
    bold: false
    size: 0.036
    primary_color: "#F2F2F2"
    emphasis_color: "#F2F2F2"
    outline_color: "#000000"
    outline: 0.002
    shadow: 0.0
    uppercase: false
    max_chars_per_line: 32
    max_lines: 2
    position: 0.12
    emphasis: false
  high_contrast:
    label: High contrast
    font: DejaVu Sans
    bold: true
    size: 0.05
    primary_color: "#FFFF00"
    emphasis_color: "#FFFFFF"
    outline_color: "#000000"
    outline: 0.0
    shadow: 0.0
    box: true             # opaque background box (BorderStyle=3)
    box_color: "#000000"
    uppercase: false
    max_chars_per_line: 24
    max_lines: 2
    position: 0.26
    emphasis: true

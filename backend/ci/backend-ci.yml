# GitHub Actions workflow. Move to .github/workflows/backend-ci.yml to enable it
# (it could not be pushed automatically: the integration lacks the `workflows` permission).
name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations are in sync with models
        env:
          STORAGE_ROOT: /tmp/cf-ci
          DATABASE_URL: sqlite:////tmp/cf-ci/ci.db
        run: mkdir -p /tmp/cf-ci && alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg EXTRAS="" -t clipforge-backend:ci backend

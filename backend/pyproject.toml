[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "1.0.0"
description = "CLIPFORGE AI - local-first long-form video to short-form clipping studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psutil>=5.9",
  "numpy>=1.24",
  "yt-dlp>=2024.4.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real local speech-to-text. Without this CLIPFORGE falls back to YouTube captions,
# and tells you so in the UI - it never invents a transcript.
ai = ["faster-whisper>=1.0.3"]
# Word-level forced alignment (adds WhisperX wav2vec2 alignment + optional diarization).
align = ["whisperx>=3.1"]
# Face/pose aware smart reframing. Without it reframing is motion/energy guided.
vision = ["opencv-python-headless>=4.9"]
# Bundled static ffmpeg binary for people who do not want to install ffmpeg.
bundled-ffmpeg = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
clipforge = "clipforge.__main__:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
  "integration: tests that shell out to ffmpeg",
  "slow: tests that take more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

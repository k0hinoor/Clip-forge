[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "1.0.0"
description = "ClipForge backend: local-first AI video clipping (API + worker + AI pipeline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "python-multipart>=0.0.18",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# Local AI: faster-whisper (CTranslate2) for transcription. Ollama is reached over HTTP.
ai = ["faster-whisper>=1.0.3"]
transformers = ["transformers>=4.44", "torch>=2.3"]
embeddings = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
clipforge-api = "clipforge.api.main:run"
clipforge-worker = "clipforge.worker.main:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["py.typed"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S602", "S604", "S605"]
ignore = ["B008", "SIM105", "SIM108", "B904", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"clipforge/scoring/text.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
  "integration: end-to-end tests that require ffmpeg/ffprobe",
]
filterwarnings = ["ignore::DeprecationWarning"]
